# Links 分享站 Chart 配置
namespace: links-ns
domain: share.k8s.local          # 访问域名（改这里 + hosts 即可换域名）

images:
  app: harbor.k8s.local:30443/blog-project/links-app:v6
  nginx: harbor.k8s.local:30443/blog-project/links-nginx:v6
  mysql: harbor.k8s.local:30443/blog-project/mysql:8.0.36
  redis: harbor.k8s.local:30443/blog-project/redis:7.2.4

# Harbor 私有仓库拉取凭据
harbor:
  registry: harbor.k8s.local:30443
  username: admin
  # 口令不落仓库：用 -f secrets.local.yaml 或 --set harbor.password=... 注入
  password: ""

# ⚠️ 演示环境默认值，生产环境必须改用外部密钥管理（Vault/KMS），勿提交真实密钥到 git
secrets:
  # 一律留空：部署时用 -f secrets.local.yaml（已加入 .gitignore）或 --set 注入
  mysqlRootPassword: ""
  dbPassword: ""
  sessionSecret: ""
  adminUser: "admin"
  adminPassword: ""

mysql:
  database: links_db
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

redis:
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

app:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  hpa:
    minReplicas: 1
    maxReplicas: 5
    cpuUtilization: 60

nginx:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
