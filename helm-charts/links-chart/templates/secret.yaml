# 敏感配置（演示环境从 values 读取，生产应使用外部密钥管理）
apiVersion: v1
kind: Secret
metadata:
  name: links-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.mysqlRootPassword | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | b64enc | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | b64enc | quote }}
