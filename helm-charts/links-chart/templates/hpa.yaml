# 水平自动扩缩容：CPU 利用率超过阈值自动加副本
# 注：需要 metrics-server 提供指标（未安装时 HPA 不生效但不报错）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: links-app-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: links-app
  minReplicas: {{ .Values.app.hpa.minReplicas }}
  maxReplicas: {{ .Values.app.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.hpa.cpuUtilization }}
