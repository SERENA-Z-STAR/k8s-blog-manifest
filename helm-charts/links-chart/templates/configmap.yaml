# ============ 非敏感配置 ============

# nginx 配置（覆盖镜像内默认配置，方便改域名/限流而不重建镜像）
apiVersion: v1
kind: ConfigMap
metadata:
  name: links-nginx-conf
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
{{ .Files.Get "files/nginx-default.conf" | indent 4 }}
---
# app 非敏感环境变量
apiVersion: v1
kind: ConfigMap
metadata:
  name: links-app-config
  namespace: {{ .Values.namespace }}
data:
  APP_PORT: "3000"
  DB_HOST: "links-mysql"
  DB_USER: "links_app"
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  REDIS_URL: "redis://links-redis:6379"
  ADMIN_USER: {{ .Values.secrets.adminUser | quote }}
---
# MySQL 首次初始化脚本
apiVersion: v1
kind: ConfigMap
metadata:
  name: links-mysql-init
  namespace: {{ .Values.namespace }}
data:
  init.sh: |
{{ .Files.Get "files/mysql-init.sh" | indent 4 }}
