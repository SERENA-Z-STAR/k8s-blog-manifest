# nginx 前端静态层 + 反代（配置由 ConfigMap 注入）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: links-nginx
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels: { app: links-nginx }
  template:
    metadata:
      labels: { app: links-nginx }
    spec:
      imagePullSecrets:
        - name: links-registry-secret
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 80, name: http }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: {{ toYaml .Values.nginx.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.nginx.resources.limits | nindent 14 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: links-nginx-conf
