# 集群内部 Service（ClusterIP）
apiVersion: v1
kind: Service
metadata:
  name: links-mysql
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None          # 无头服务，StatefulSet 固定网络标识
  selector: { app: links-mysql }
  ports:
    - { port: 3306, targetPort: 3306 }
---
apiVersion: v1
kind: Service
metadata:
  name: links-redis
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector: { app: links-redis }
  ports:
    - { port: 6379, targetPort: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: links-app
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: links-app }
  ports:
    - { port: 3000, targetPort: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: links-nginx
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: links-nginx }
  ports:
    - { port: 80, targetPort: 80 }
