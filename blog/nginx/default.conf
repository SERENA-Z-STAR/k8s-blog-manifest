# K8s 版 nginx 配置（upstream 用 Service 名，去掉 Docker DNS resolver）
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=publish:10m rate=2r/s;

# 上游服务：K8s 集群内 Service 名
upstream blog_app {
    server blog-app:3000;
}

server {
    listen 80;
    server_name blog.k8s.local zqqqz.xyz localhost;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # 首页/通用路由
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://blog_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 发布接口（严格限流）
    location /publish {
        limit_req zone=publish burst=5 nodelay;
        proxy_pass http://blog_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 健康检查接口（不限流）
    location /health {
        proxy_pass http://blog_app;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
}
