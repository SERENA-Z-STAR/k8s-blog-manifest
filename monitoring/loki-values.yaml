# Loki 单实例最小化配置（worker 节点）
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  storageConfig:
    filesystem:
      directory: /var/loki/chunks

singleBinary:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: k8s-node01
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    storageClass: local-path
    size: 5Gi

# 关闭测试/缓存组件（单实例不需要）
canary:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
indexCache:
  enabled: false

# 禁用分布式模式组件
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  replicas: 0
